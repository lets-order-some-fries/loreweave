name: Feature request
description: A new capability for the CLI or MCP server
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do with your vault today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Keep the local-first boundary in mind — the vault is the source of truth and the index is a disposable cache.
    validations:
      required: true
