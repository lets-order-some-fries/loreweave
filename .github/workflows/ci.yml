name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 pinned (not -latest): the 2026-08 windows-latest image
        # ships Visual Studio 18, which node-gyp cannot recognize yet — so
        # when a better-sqlite3 prebuilt fetch misses, the source-build
        # fallback dies toolchain-less. Unpin once node-gyp supports VS18.
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node eval/run.mjs --gate

  # The suite above tests src/. This tests what users actually install: the
  # packed tarball, its bin, its library entrypoint, its types, and the MCP
  # server — the faults that only appear after `npm install` — on every Node
  # version the test job covers.
  package:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    # Install the way a machine without a C++ toolchain does. better-sqlite3
    # downloads a prebuilt binary for the running Node and, when there is
    # none, falls back to compiling from source. On a runner that has a
    # toolchain that fallback quietly succeeds and CI stays green, while
    # anyone without one cannot install at all — as with 0.38.0 on Node 24,
    # which had no prebuild. With CC and CXX set to `false`, every compile and
    # link step node-gyp generates runs `false`, so a missing prebuild fails
    # this job instead.
    env:
      CC: 'false'
      CXX: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bash scripts/smoke-package.sh
